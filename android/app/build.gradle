plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'dev.flutter.flutter-gradle-plugin'
    id 'com.chaquo.python'
}

android {
    namespace 'com.smartfind.smartfind_app'
    compileSdk 36
    ndkVersion '26.1.10909125'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId 'com.smartfind.smartfind_app'
        minSdkVersion flutter.minSdkVersion
        targetSdk 36
        versionCode 1
        versionName '1.0.0'

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }

        python {
            version "3.10"
            buildPython '/opt/homebrew/bin/python3.10'

            pip {
                // Network and File Utilities
                install 'requests==2.32.3'
                install 'chardet==5.2.0'
                install 'jsonlines==4.0.0'

                // Document Readers
                install 'python-docx==1.1.2'
                install 'pypdf==4.3.1'

                // ML / Vector Processing
                // Pinning numpy < 2.0 is critical for gensim/scipy compatibility
                install 'numpy==1.23.3'
                install 'scipy==1.8.1'
                install 'gensim==4.4.0'
                install 'networkx==3.1'
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }

    sourceSets {
        main {
            python.srcDir 'src/main/python'
            assets.srcDirs = ['src/main/assets']
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    // Add any additional dependencies here if needed
}